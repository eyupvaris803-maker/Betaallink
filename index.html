<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betaalsimulatie - Schoolproject</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 400px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .demo {
      background: #fff3cd;
      color: #856404;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .amount {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    .info {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #d1e7dd;
      color: #0f5132;
      border-radius: 8px;
      text-align: center;
    }

    .small {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="demo">
      ?? BETAALSIMULATIE � SCHOOLPROJECT
    </div>

    <h1>Betaling</h1>

    <div class="info">
      <strong>Omschrijving:</strong><br>
      Voorbeeld schoolopdracht
    </div>

    <div class="amount">
      �12,50
    </div>

    <button onclick="simulatePayment()">
      Simuleer betaling
    </button>

    <div id="result">
      ? Simulatie voltooid!<br><br>
      Er is <strong>geen echte betaling</strong> uitgevoerd.
    </div>

    <div class="small">
      Dit is een fictieve betaalpagina en maakt geen verbinding
      met een bank, betaalprovider of echte betaalomgeving.
    </div>

  </div>

  <script>
    function simulatePayment() {
      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
